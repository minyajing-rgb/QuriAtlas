name: Build test deploy QuriAtlas
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'assets/art/**'
      - 'tools/prepare_web_art.py'
      - 'build.py'
      - 'tests/**'
      - 'CNAME'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
concurrency:
  group: quriatlas-pages
  cancel-in-progress: false
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://quriatlas.saga1001.com/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Inspect actual Pages publishing source
        run: |
          mkdir -p build/diagnostics
          gh api "repos/$GITHUB_REPOSITORY/pages" > build/diagnostics/pages-before.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/diagnostics/pages-before.json').read_text())
          safe={k:data.get(k) for k in ['build_type','source','cname','html_url','status','https_enforced']}
          print('ACTUAL PAGES CONFIGURATION',json.dumps(safe),flush=True)
          source=data.get('source') or {}
          assert source.get('branch')=='main' and source.get('path')=='/docs', 'Publishing source changed; do not deploy to an unverified directory'
          assert data.get('cname','').lower()=='quriatlas.saga1001.com', 'Custom domain mismatch'
          assert data.get('build_type','legacy')=='legacy', 'Expected the existing branch publisher, not a second artifact publisher'
          PY
      - name: Install reproducible image and browser tools
        run: |
          python -m pip install 'Pillow==11.3.0' 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Build all pages and native art crops
        run: |
          python build.py
          node --check site/app.js
          node --check site/release.js
          node --check site/hardening.js
          python -m py_compile tests/e2e.py tools/prepare_web_art.py
      - name: Verify all pages and interactions before publishing
        run: |
          python -m http.server 8080 --directory build/public >/tmp/quriatlas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          python tests/e2e.py --url http://127.0.0.1:8080/ --out build/qa-local --commit "$GITHUB_SHA"
      - name: Populate the actual docs publishing directory
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          src=Path('build/public');dst=Path('docs')
          release=json.loads((src/'release.json').read_text())
          assert len(release['pages'])==11
          assert (src/'index.html').stat().st_size>10000
          assert (src/'CNAME').read_text().strip()=='quriatlas.saga1001.com'
          # Copy the tested site, not the repository's old, almost-empty docs directory.
          # Preserve unrelated documentation; only generated public paths are replaced.
          shutil.copytree(src,dst,dirs_exist_ok=True)
          (dst/'.nojekyll').touch()
          for name,expected in release['files'].items():
              assert hashlib.sha256((dst/name).read_bytes()).hexdigest()==expected,name
          assert (dst/'release.json').read_bytes()==(src/'release.json').read_bytes()
          print('DOCS SNAPSHOT VERIFIED',len(release['files']),'files; 11 pages; 9 artworks',flush=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs index.html explore.html lab.html mind.html stories.html play.html community.html journey.html sources.html about.html entanglement.html release.json assets/art/*-web.webp assets/art/web-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: populate actual main/docs Pages source with verified full site'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "PUBLISH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish using the existing branch-based Pages publisher only
        run: |
          python - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['PUBLISH_COMMIT']
          # A push normally requests this build. Request it explicitly as well;
          # an already queued/running build is acceptable and is still verified below.
          request=subprocess.run(['gh','api','--method','POST','repos/'+repo+'/pages/builds'],capture_output=True,text=True)
          print('PAGES BUILD REQUEST',request.returncode,request.stdout[:800],request.stderr[:500],flush=True)
          rows=[]
          for attempt in range(72):
              runs=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs?head_sha='+head+'&per_page=30'],text=True))['workflow_runs']
              relevant=[r for r in runs if r.get('path','').startswith('dynamic/pages/')]
              status=[{k:r.get(k) for k in ['id','status','conclusion','html_url','head_sha']} for r in relevant]
              rows.append({'attempt':attempt+1,'runs':status})
              print('SINGLE PUBLISHER',json.dumps(status),flush=True)
              Path('build/diagnostics/branch-publication.json').write_text(json.dumps(rows,indent=2))
              if relevant and all(r['status']=='completed' for r in relevant):
                  assert all(r['conclusion']=='success' for r in relevant), 'Branch Pages publication failed'
                  break
              time.sleep(5)
          else:raise SystemExit('Branch Pages publication did not complete')
          PY
      - name: Verify root and every page expose this exact tested release
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request,urllib.error
          from pathlib import Path
          expected=json.loads(Path('build/public/release.json').read_text())
          urls=['','index.html','lab.html','stories.html','sources.html','release.json']
          records=[]
          for attempt in range(30):
              try:
                  for name in urls:
                      req=urllib.request.Request(os.environ['PUBLIC_URL']+name,headers={'Cache-Control':'no-cache','User-Agent':'QuriAtlas-release-verification'})
                      with urllib.request.urlopen(req,timeout=30) as response:
                          body=response.read();code=response.status
                          records.append({'url':response.url,'status':code,'attempt':attempt+1,'bytes':len(body)})
                      assert code==200
                      if name=='release.json':assert json.loads(body)['source_commit']==os.environ['GITHUB_SHA']
                      else:assert hashlib.sha256(body).hexdigest()==expected['files'][name or 'index.html'], 'Unexpected public page: '+name
                  print('ROOT AND KEY PAGES VERIFIED WITHOUT A CACHE-BUSTING QUERY',os.environ['PUBLIC_URL'],os.environ['GITHUB_SHA'],flush=True)
                  break
              except Exception as exc:
                  records.append({'attempt':attempt+1,'error':str(exc)[:500]})
                  print(type(exc).__name__,str(exc)[:300],flush=True)
                  time.sleep(8)
          else:raise SystemExit('Public root/page hashes do not match the tested release')
          Path('build/diagnostics/root-http.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Verify all public pages images bilingual controls and experiments
        run: |
          python tests/e2e.py --url "$PUBLIC_URL" --out build/qa-public --commit "$GITHUB_SHA"
      - name: Recheck stability and capture the actual public root
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          expected=json.loads(Path('build/public/release.json').read_text())
          records=[]
          # No more commits or other deployment mechanism after the verified publish.
          for sample in range(3):
              if sample:time.sleep(15)
              for name in ['','index.html','lab.html','stories.html']:
                  with urllib.request.urlopen(os.environ['PUBLIC_URL']+name,timeout=30) as r:
                      body=r.read();assert r.status==200
                  assert hashlib.sha256(body).hexdigest()==expected['files'][name or 'index.html']
                  records.append({'url':os.environ['PUBLIC_URL']+name,'status':200,'sha256':hashlib.sha256(body).hexdigest(),'utc':datetime.now(timezone.utc).isoformat()})
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              page=browser.new_page(viewport={'width':1440,'height':1000},reduced_motion='reduce')
              r=page.goto(os.environ['PUBLIC_URL'],wait_until='networkidle');assert r.status==200
              page.screenshot(path='build/qa-public/root-live-desktop.png',full_page=True)
              page.set_viewport_size({'width':390,'height':844})
              page.screenshot(path='build/qa-public/root-live-mobile.png',full_page=True)
              browser.close()
          receipt={'verified_at_utc':datetime.now(timezone.utc).isoformat(),'source_commit':os.environ['GITHUB_SHA'],'publish_commit':os.environ['PUBLISH_COMMIT'],'root_url':os.environ['PUBLIC_URL'],'publisher':'GitHub Pages main/docs only','stability_samples':records,'run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          Path('build/qa-public/deployment-receipt.json').write_text(json.dumps(receipt,indent=2))
          print('LIVE SITE DELIVERY VERIFIED',json.dumps(receipt),flush=True)
          PY
          gh api "repos/$GITHUB_REPOSITORY/pages" > build/diagnostics/pages-after.json
      - name: Archive public and local evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quriatlas-publish-fix-${{ github.run_id }}
          path: |
            build/qa-local/
            build/qa-public/
            build/diagnostics/
            release.json
          retention-days: 30
          if-no-files-found: warn
