name: Build test deploy QuriAtlas
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'assets/art/**'
      - 'tools/prepare_web_art.py'
      - 'build.py'
      - 'tests/**'
      - 'CNAME'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: quriatlas-pages
  cancel-in-progress: true
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install reproducible image and browser tools
        run: |
          python -m pip install 'Pillow==11.3.0' 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Build all pages and native art crops
        run: |
          python build.py
          node --check site/app.js
          node --check site/release.js
          node --check site/hardening.js
          python -m py_compile tests/e2e.py tools/prepare_web_art.py
      - name: Verify all pages and interactions before publishing
        run: |
          python -m http.server 8080 --directory build/public >/tmp/quriatlas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          python tests/e2e.py --url http://127.0.0.1:8080/ --out build/qa-local --commit "$GITHUB_SHA"
      - name: Archive tested pages and web assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html explore.html lab.html mind.html stories.html play.html community.html journey.html sources.html about.html entanglement.html release.json assets/art/*-web.webp assets/art/web-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish native-art bilingual full site v0.6.1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure existing GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete tested website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/public
      - name: Deploy existing custom-domain website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Wait for the exact source commit on the custom domain
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Deployment URL: $DEPLOYED_URL"
          python - <<'PY'
          import json,os,time,urllib.request
          url='https://quriatlas.saga1001.com/'
          expected=os.environ['GITHUB_SHA']
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url+'release.json?verify='+str(time.time_ns()),timeout=20) as r:
                      release=json.load(r)
                  if release.get('source_commit')==expected and release.get('version')=='0.6.1-atlantis-fullsite':
                      print('EXACT PUBLIC RELEASE VERIFIED',url,expected)
                      break
              except Exception as e:
                  print(type(e).__name__,str(e)[:180])
              time.sleep(5)
          else:
              raise SystemExit('Custom domain did not expose this exact commit')
          PY
      - name: Verify public pages assets interactions and screenshots
        run: python tests/e2e.py --url https://quriatlas.saga1001.com/ --out build/qa-public --commit "$GITHUB_SHA"
      - name: Archive verified public report
        run: |
          mkdir -p qa
          cp build/qa-public/report.json qa/release-0.6.1.json
          git add qa/release-0.6.1.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa: archive exact-commit custom-domain acceptance v0.6.1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive public and local evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quriatlas-fullsite-0.6.1
          path: |
            build/qa-local/
            build/qa-public/
            release.json
          retention-days: 30
          if-no-files-found: warn
