<svg id="atlasSvg" viewBox="0 0 1200 470" role="group" aria-label="六个知识分区的静态地图" xmlns="http://www.w3.org/2000/svg"><title>量子漫游：六个知识分区</title><desc>按学习主题组织的二十四个入门概念，配套网页中可点击分区筛选概念卡。</desc><rect width="100%" height="100%" fill="#fbf9fd"/><g fill="none" stroke="#d6cae5" stroke-width="1.5"><path d="M600 232 Q210 232 210 95"/><path d="M600 232 Q600 232 600 70"/><path d="M600 232 Q990 232 990 95"/><path d="M600 232 Q990 232 990 365"/><path d="M600 232 Q600 232 600 390"/><path d="M600 232 Q210 232 210 365"/></g><g transform="translate(0 0)"><circle cx="600" cy="232" r="78" fill="#efe7f8" stroke="#c3acdc"/><circle cx="600" cy="232" r="88" fill="none" stroke="#d0b785" stroke-dasharray="3 8"/><text x="600" y="227" text-anchor="middle" fill="#51406e" font-size="26" font-family="serif">量子漫游</text><text x="600" y="253" text-anchor="middle" fill="#8b789e" font-size="11" letter-spacing="2">QURIATLAS</text></g><g class="mapnode" data-cat="light" aria-label="光与波，4 个概念"><rect x="77" y="52" width="266" height="86" rx="15" fill="#fff" stroke="#ddd1e8"/><text x="100" y="82" fill="#a6864b" font-size="11">01 / 04 ENTRIES</text><text x="100" y="109" fill="#43374f" font-size="21" font-family="serif">光与波</text><text x="320" y="110" fill="#a38abb" text-anchor="end" font-size="20">↗</text><text x="100" y="127" fill="#7c7488" font-size="10">从看得见的现象出发</text></g><g class="mapnode" data-cat="rules" aria-label="量子规则，6 个概念"><rect x="467" y="27" width="266" height="86" rx="15" fill="#fff" stroke="#ddd1e8"/><text x="490" y="57" fill="#a6864b" font-size="11">02 / 06 ENTRIES</text><text x="490" y="84" fill="#43374f" font-size="21" font-family="serif">量子规则</text><text x="710" y="85" fill="#a38abb" text-anchor="end" font-size="20">↗</text><text x="490" y="102" fill="#7c7488" font-size="10">理解世界的新语法</text></g><g class="mapnode" data-cat="matter" aria-label="原子与物质，4 个概念"><rect x="857" y="52" width="266" height="86" rx="15" fill="#fff" stroke="#ddd1e8"/><text x="880" y="82" fill="#a6864b" font-size="11">03 / 04 ENTRIES</text><text x="880" y="109" fill="#43374f" font-size="21" font-family="serif">原子与物质</text><text x="1100" y="110" fill="#a38abb" text-anchor="end" font-size="20">↗</text><text x="880" y="127" fill="#7c7488" font-size="10">小尺度的大不同</text></g><g class="mapnode" data-cat="information" aria-label="关联与信息，5 个概念"><rect x="857" y="322" width="266" height="86" rx="15" fill="#fff" stroke="#ddd1e8"/><text x="880" y="352" fill="#a6864b" font-size="11">04 / 05 ENTRIES</text><text x="880" y="379" fill="#43374f" font-size="21" font-family="serif">关联与信息</text><text x="1100" y="380" fill="#a38abb" text-anchor="end" font-size="20">↗</text><text x="880" y="397" fill="#7c7488" font-size="10">纠缠能做什么</text></g><g class="mapnode" data-cat="frontier" aria-label="意识与边界，3 个概念"><rect x="467" y="347" width="266" height="86" rx="15" fill="#fff" stroke="#ddd1e8"/><text x="490" y="377" fill="#a6864b" font-size="11">05 / 03 ENTRIES</text><text x="490" y="404" fill="#43374f" font-size="21" font-family="serif">意识与边界</text><text x="710" y="405" fill="#a38abb" text-anchor="end" font-size="20">↗</text><text x="490" y="422" fill="#7c7488" font-size="10">开放问题，逐条求证</text></g><g class="mapnode" data-cat="method" aria-label="科学的读法，2 个概念"><rect x="77" y="322" width="266" height="86" rx="15" fill="#fff" stroke="#ddd1e8"/><text x="100" y="352" fill="#a6864b" font-size="11">06 / 02 ENTRIES</text><text x="100" y="379" fill="#43374f" font-size="21" font-family="serif">科学的读法</text><text x="320" y="380" fill="#a38abb" text-anchor="end" font-size="20">↗</text><text x="100" y="397" fill="#7c7488" font-size="10">区分概念、证据与隐喻</text></g></svg>
