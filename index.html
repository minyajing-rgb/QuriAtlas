":"MIT OpenCourseWare","url":"https://ocw.mit.edu/courses/8-04-quantum-physics-i-spring-2016/","kind":"institutional_course","level":"C","year":2016,"access":"open_course","review":"course_overview"},{"id":"S13","title":"8.04 Quantum Physics I — Calendar","organization":"MIT OpenCourseWare","url":"https://ocw.mit.edu/courses/8-04-quantum-physics-i-spring-2016/pages/calendar/","kind":"course_curriculum","level":"C","year":2016,"access":"open_html","review":"curriculum"},{"id":"S14","title":"Decoherence, einselection, and the quantum origins of the classical","author":"Wojciech H. Zurek","organization":"arXiv / Reviews of Modern Physics","url":"https://arxiv.org/abs/quant-ph/0105127","doi":"10.1103/RevModPhys.75.715","kind":"author_review","level":"B","preprint_year":2001,"publication_year":2003,"access":"abstract_and_linked_fulltext","review":"abstract_and_metadata","peer_review":"journal_version_published"},{"id":"S15","title":"The importance of quantum decoherence in brain processes","author":"Max Tegmark","organization":"arXiv / Physical Review E","url":"https://arxiv.org/abs/quant-ph/9907009","doi":"10.1103/PhysRevE.61.4194","kind":"theoretical_paper","level":"A","preprint_year":1999,"publication_year":2000,"access":"abstract_and_linked_fulltext","review":"abstract_and_metadata","peer_review":"journal_version_published","limitation":"针对文中建模的自由度与参数，不自动排除一切可能的脑内量子机制。"},{"id":"S16","title":"Quantum Cognition: The possibility of processing with nuclear spins in the brain","author":"Matthew P. A. Fisher","organization":"arXiv / Annals of Physics","url":"https://arxiv.org/abs/1508.05929","kind":"theoretical_proposal","level":"A","publication_year":2015,"access":"abstract_and_linked_fulltext","review":"abstract_and_metadata","peer_review":"journal_version_published","limitation":"提出可研究的机制，不等于已证实人脑通过该机制产生意识。"},{"id":"S17","title":"Significant-loophole-free test of Bell's theorem with entangled photons","author":"Marissa Giustina et al.","organization":"arXiv / Physical Review Letters","url":"https://arxiv.org/abs/1511.03190","kind":"experimental_paper","level":"A","publication_year":2015,"access":"abstract_and_linked_fulltext","review":"abstract_and_metadata","data_access":"摘要页说明实验数据可向通讯作者索取；本项目未取得原始数据。"},{"id":"S18","title":"The Quantum Atlas — About","organization":"University of Maryland / JQI","url":"https://quantumatlas.umd.edu/about/","kind":"project_self_description","level":"A","access":"open_html","review":"page_text","role":"同类产品与品牌重名检查，不作为物理事实的直接证据。"},{"id":"S19","title":"Quantum Wave Interference","organization":"PhET, University of Colorado Boulder","url":"https://phet.colorado.edu/en/simulations/quantum-wave-interference","kind":"simulation_catalog","level":"C","access":"external_simulation","review":"catalog_page","limitation":"外部模拟未在本站内集成或运行验收。"},{"id":"S20","title":"The Quantum Atlas — Get Started","organization":"University of Maryland / JQI","url":"https://quantumatlas.umd.edu/start/","kind":"institutional_learning_path","level":"C","access":"open_html","review":"page_text"}],"entries":[{"id":"Q001","title":"光子","en":"Photon","category":"light","hook":"光可以一份一份地被探测吗？","summary":"光与物质交换能量时呈现量子化特征。对频率确定的光子，能量满足 E = hf。","example":"把入射光减弱，敏感探测器仍可能记录一个个离散事件。","limit":"图上的小光点是示意，不代表光子是一颗有确定表面的微型球。","source_ids":["S05"],"next":["Q002","Q022"]},{"id":"Q002","title":"波粒二象性","en":"Wave–particle duality","category":"light","hook":"它到底是一颗粒子，还是一道波？","summary":"量子对象能表现出干涉，也能以离散事件被探测。经典小球和水波都只是部分适用的类比。","example":"屏幕每次出现一个点，许多次事件却形成干涉分布。","limit":"不是对象根据人的意念在经典球和经典波之间变身。","source_ids":["S01","S02"],"next":["Q004"]},{"id":"Q003","title":"干涉","en":"Interference","category":"light","hook":"两种可能性，为什么可以互相抵消？","summary":"无法区分的路径要先相加概率振幅，再取模平方。相位关系能让某些结果更常见，也能压低另一些结果。","example":"改变本页双缝模型的相位，明暗条纹会移动。","limit":"水波也会干涉；看到干涉并不自动证明某个系统发生了特有的量子效应。","source_ids":["S01","S06"],"next":["Q007"]},{"id":"Q004","title":"双缝实验","en":"Double-slit experiment","category":"light","hook":"一次只发一个，为什么最后还有条纹？","summary":"保持两条路径的相干性时，离散探测事件可以累积成干涉图样。路径信息变得可区分时，干涉可见度会降低。","example":"在互动实验中切换路径探测器，再累积更多探测点。","limit":"这里是预设模型的随机采样，不是现场实验数据；不需要一个有意识的人盯着仪器。","source_ids":["S01","S06"],"next":["Q008","Q019"]},{"id":"Q005","title":"量子态","en":"Quantum state","category":"rules","hook":"预测之前，先怎样描述这个系统？","summary":"量子态组织了系统可被预测的测量统计。它不是把位置和速度等经典属性简单罗列在一起。","example":"准备相同的态，再做许多次相同测量，比较结果频率。","limit":"关于量子态究竟代表现实本身还是知识，不同诠释有不同回答。","source_ids":["S09"],"next":["Q006","Q018"]},{"id":"Q006","title":"波函数","en":"Wavefunction","category":"rules","hook":"那片概率云，是一团真的雾吗？","summary":"波函数是在某种表象中描述量子态的概率振幅。对位置测量，模平方给出概率密度。","example":"波函数可以有不同相位，即使某一时刻的位置概率密度相同。","limit":"它一般是复数函数，不是空气、水或灵性物质的振动图。","source_ids":["S03"],"next":["Q007","Q024"]},{"id":"Q007","title":"玻恩规则","en":"Born rule","category":"rules","hook":"怎样把可能性变成可以比较的数字？","summary":"对规范化的态，测得某一结果的概率由对应振幅的模平方给出。概率密度要在一个区间积分才得到区间概率。","example":"双缝两条路径的振幅相加后平方，不等于两份概率直接相加。","limit":"这条统计规则不让我们随意选择下一次随机结果。","source_ids":["S01","S03"],"next":["Q008"]},{"id":"Q008","title":"量子测量","en":"Quantum measurement","category":"rules","hook":"物理学里的观察者，一定是人吗？","summary":"测量把系统和装置联系起来，产生可记录的结果。标准计算不需要把人的意识另加为一个物理变量。","example":"自动探测器记录数据，之后再由人读取。","limit":"测量结果如何出现仍涉及基础诠释问题；不能由此推出意念可控制外界结果。","source_ids":["S07","S14"],"next":["Q019","Q020"]},{"id":"Q009","title":"不确定性关系","en":"Uncertainty relation","category":"rules","hook":"为什么两张分布图不能同时无限收窄？","summary":"位置和动量的标准差满足 Δx Δp ≥ ℏ/2。最小不确定度高斯态恰好达到等号。","example":"拖动本页高斯态宽度：位置分布变窄，动量分布变宽。","limit":"这是特定可观测量的统计约束，不是任何事情都无法确定。","source_ids":["S02"],"next":["Q006"]},{"id":"Q010","title":"自旋","en":"Spin","category":"matter","hook":"不是真的自转，为什么还叫自旋？","summary":"自旋是量子对象的内禀角动量属性。1922 年的 Stern–Gerlach 实验显示银原子束产生离散分裂。","example":"对自旋二分之一系统，沿某方向测量会得到两种可能结果。","limit":"不能把电子自旋完全理解成一个小球绕轴旋转。","source_ids":["S08"],"next":["Q018"]},{"id":"Q011","title":"能级","en":"Energy levels","category":"matter","hook":"原子为什么只吸收某些颜色？","summary":"原子的束缚态具有离散能级。吸收或发射的光子能量可与两个能级的差对应。","example":"用楼梯帮助理解离散取值，再回到能级差与光子能量。","limit":"楼梯只是类比；不是说所有量子系统的全部能量都只能离散取值。","source_ids":["S05","S13"],"next":["Q022"]},{"id":"Q012","title":"量子隧穿","en":"Quantum tunneling","category":"matter","hook":"能量不够翻过去，也能在另一侧被发现？","summary":"在某些势垒条件下，量子态可以在经典禁阻区延伸，并在势垒另一侧具有非零透射概率。","example":"把势垒宽度当作可调参数，比较透射变化。","limit":"不能据此认为人体可凭意念穿墙；具体概率由物理系统与势垒决定。","source_ids":["S09","S13"],"next":["Q024"]},{"id":"Q013","title":"全同粒子","en":"Identical particles","category":"matter","hook":"两个电子换个位置，能靠标签分开吗？","summary":"全同量子粒子的交换对称性会影响多粒子态及其统计行为。玻色子与费米子的处理不同。","example":"从给小球贴名字的直觉，走向不能逐个经典标记的多粒子描述。","limit":"不可区分不意味着所有不同类型粒子都相同。","source_ids":["S04"],"next":["Q005"]},{"id":"Q014","title":"量子纠缠","en":"Entanglement","category":"information","hook":"两边的结果怎样超出普通的相关？","summary":"纠缠是一类不能用可分离态表达的量子关联。只展示两边总相同或总相反，并不足以区分它与经典相关。","example":"比较多个测量设置下的联合统计，而不是只看一次巧合。","limit":"纠缠不是情感默契或灵魂伴侣的物理证据。","source_ids":["S11"],"next":["Q015","Q016"]},{"id":"Q015","title":"贝尔检验","en":"Bell test","category":"information","hook":"怎样让一场哲学争论接受实验检验？","summary":"在明确的局域性、测量设置独立性等假设下，某些经典模型的关联受贝尔不等式约束。实验可检验其是否被违反。","example":"本页 CHSH 模型显示经典界限 2 与理想量子值 2√2。","limit":"模型画出违反并不是新实验；真实检验还要处理探测和局域性等漏洞。","source_ids":["S11","S17"],"next":["Q016"]},{"id":"Q016","title":"不能靠纠缠超光速传信","en":"No-signalling","category":"information","hook":"既然有关联，能不能瞬间发一条消息？","summary":"只观察一侧的局部结果，不能读出另一侧自由选择的信息。要利用或比较关联，仍需合适的通信与数据比较。","example":"在纠缠互动中转动另一侧设置，单侧结果的理论概率仍为一半。","limit":"非经典关联不等于可控制的超光速通信。","source_ids":["S10","S11"],"next":["Q017"]},{"id":"Q017","title":"量子隐形传态","en":"Quantum teleportation","category":"information","hook":"传过去的是物体，还是量子态？","summary":"协议利用共享纠缠、测量和经典通信，将未知量子态转移到另一个系统。","example":"接收端需要知道发送端的测量结果，才能完成相应操作。","limit":"不是搬运整个人；也不是不经过经典消息的瞬时传送。","source_ids":["S10","S11"],"next":["Q018"]},{"id":"Q018","title":"量子比特","en":"Qubit","category":"information","hook":"最小的量子信息单位怎样理解？","summary":"量子比特用二维量子系统描述。相对于选定基底，其态可具有两个基态的叠加。","example":"用两个能级或偏振自由度帮助理解抽象的两态系统。","limit":"一次测量不会把叠加里的全部振幅作为可读经典答案交出来。","source_ids":["S09","S11","S20"],"next":["Q014"]},{"id":"Q019","title":"退相干","en":"Decoherence","category":"frontier","hook":"为什么日常生活看不见那么多干涉？","summary":"系统与环境相互作用，会让局部可见的相干性降低。环境记录使某些干涉更难观察。","example":"调低本页可见度，条纹变淡；这只是相干性降低的现象模型。","limit":"退相干的计算不自动替所有诠释解决单一测量结果问题。","source_ids":["S14"],"next":["Q020"]},{"id":"Q020","title":"测量问题与诠释","en":"Measurement problem","category":"frontier","hook":"算得准，是否就代表我们已知道一切？","summary":"关于量子态、测量及现实之间的关系，有不同解释框架。可检验的预测与本体论解释要分开。","example":"先问各方是否预测不同实验结果，再比较其解释与额外假设。","limit":"未解决的诠释问题不等于任何超自然主张都已获得支持。","source_ids":["S07","S14"],"next":["Q021","Q023"]},{"id":"Q021","title":"量子与意识研究","en":"Quantum and consciousness research","category":"frontier","hook":"有人认真研究过这个问题吗？","summary":"有研究者提出脑内量子处理机制，也有人计算特定脑过程中的退相干约束。不同模型必须分别评估。","example":"并读 Fisher 的核自旋机制提案与 Tegmark 的退相干分析，明确它们并非同一模型的直接对照实验。","limit":"这里介绍历史论文的提案与争论，不声称已完成截至今日的系统综述，也不声称量子意识被证实。","source_ids":["S15","S16"],"next":["Q019","Q023"]},{"id":"Q022","title":"能量与频率","en":"Energy and frequency","category":"method","hook":"物理学里的高频，和感觉里的高频是一回事吗？","summary":"对频率确定的光子，E = hf 将能量与频率连接起来。把同一个词用于情绪时，需要另外定义其意义。","example":"红光、蓝光的光子频率可测；描述心情的高频通常是另一种语言用途。","limit":"不能直接用光子的公式推出情绪高低能改变财富、健康或他人的行为。","source_ids":["S05","S02"],"next":["Q023"]},{"id":"Q023","title":"如何读证据","en":"Reading evidence","category":"method","hook":"一段话有论文链接，就已经被证实了吗？","summary":"先分清实验报告、理论提案、综述和科普，再看来源究竟支持哪一句话。存在一篇论文不等于结论得到独立验证。","example":"实验摘要说测到了某种相关；理论摘要说提出一种可能机制。两者不能使用同一种证据标签。","limit":"来源等级和主张是否成立是两个字段；不把机构名当作结论的担保。","source_ids":["S15","S16","S17"],"next":["Q015","Q021"]},{"id":"Q024","title":"薛定谔方程","en":"Schrödinger equation","category":"rules","hook":"量子态随时间怎样变化？","summary":"在适用范围内，薛定谔方程给出量子态的时间演化。需要指定初始态与系统的哈密顿量。","example":"给定势能与初始波函数，计算之后的概率分布，再与实验比较。","limit":"不是输入愿望并生成结果的公式；非相对论模型也有自己的适用边界。","source_ids":["S03","S12"],"next":["Q006","Q012"]}],"bridges":[{"id":"B01","question":"观察者效应，是意识创造现实吗？","label":"物理概念与哲学追问","answer":"量子测量涉及可记录的物理相互作用；标准计算不要求人的意识作为额外变量。测量的解释可以讨论，但不能直接推出意念控制结果。","source_ids":["S07","S14"],"related":["Q008","Q020"]},{"id":"B02","question":"纠缠，能证明心灵感应吗？","label":"不能由此推出","answer":"量子纠缠有严格的制备、测量和统计含义。它不自动适用于两个人的主观默契，也不能让一方通过单侧结果读出另一方发送的超光速消息。","source_ids":["S10","S11"],"related":["Q014","Q016"]},{"id":"B03","question":"提升频率，和 E = hf 是同一回事吗？","label":"隐喻与可测量量分开","answer":"光子能量与频率有明确关系。描述心情、状态或价值观的频率，可以作为自我表达，但没有因此成为同一个物理量。","source_ids":["S05","S02"],"related":["Q022"]},{"id":"B04","question":"量子与意识，是完全没人研究吗？","label":"有理论研究，不等于已证实","answer":"确有脑内量子处理提案，也有关于退相干的反对分析。本站分别注明模型、作者与证据状态，不把争论写成已经完成的证明。","source_ids":["S15","S16"],"related":["Q021","Q023"]},{"id":"B05","question":"既然不确定，是否任何愿望都可能成真？","label":"统计约束不是愿望机制","answer":"不确定性关系约束特定可观测量的分布；概率也受状态和实验条件约束。它不意味着所有想象具有任意概率。","source_ids":["S02","S03"],"related":["Q009","Q007"]},{"id":"B06","question":"可以保留灵性体验，同时认真学科学吗？","label":"本站编辑原则","answer":"可以从自己的问题与体验出发。这里把主观体验、文化意义、哲学观点和可检验的物理主张分别记录：不嘲笑体验，也不把体验自动当作某个物理机制的证明。","source_ids":[],"related":["Q023"],"epistemic_status":"editorial_principle_not_experimental_claim"}],"timeline":[{"id":"T01","year":1922,"date_type":"experiment_year","title":"一束原子，分成离散的两路","text":"Stern–Gerlach 实验进入这条学习线：它如何改变我们对角动量的直觉？","source_ids":["S08"],"related":"Q010","geography_status":"not_yet_crosswalked"},{"id":"T02","year":1927,"date_type":"period_endpoint_1926_1927","title":"新的量子描述逐渐成形","text":"Feynman 的历史回顾把 1926–1927 年作为形成一致量子描述的关键时期；这里不是单一事件的精确日期。","source_ids":["S01"],"related":"Q024","geography_status":"multi_location_not_yet_crosswalked"},{"id":"T03","year":2000,"date_type":"journal_publication_year","title":"对脑内量子机制提出数量级约束","text":"Tegmark 的文章于 1999 年发布预印本，2000 年发表于期刊；关注特定脑过程的退相干估计。","source_ids":["S15"],"related":"Q021","geography_status":"publication_not_experiment_location"},{"id":"T04","year":2003,"date_type":"review_publication_year","title":"为什么世界常常看起来像经典的？","text":"Zurek 的退相干综述发表于 2003 年；其 arXiv 初版提交于 2001 年。","source_ids":["S14"],"related":"Q019","geography_status":"publication_not_experiment_location"},{"id":"T05","year":2015,"date_type":"paper_publication_year","title":"把贝尔检验做得更严格","text":"Giustina 等报告同时关闭主要漏洞的光子贝尔检验；本站提供论文入口，尚未复核原始实验数据。","source_ids":["S17"],"related":"Q015","geography_status":"not_yet_crosswalked"},{"id":"T06","year":2015,"date_type":"proposal_publication_year","title":"另一条脑内量子处理提案","text":"Fisher 提出核自旋与特定分子参与量子处理的可能机制；这是研究提案，不是意识机制已被证实。","source_ids":["S16"],"related":"Q021","geography_status":"publication_not_experiment_location"}],"learning_paths":[{"id":"beginner","title":"完全零基础","steps":["Q001","Q004","Q003","Q005","Q008","Q009","Q014","Q023"]},{"id":"spiritual","title":"从灵性问题出发","steps":["Q022","Q008","Q014","Q016","Q019","Q020","Q021","Q023"]},{"id":"research","title":"追到原始证据","steps":["Q023","Q007","Q015","Q019","Q021","Q024"]}],"expansion_plan":{"status":"planned_not_collected","target_canonical_entries":360,"not_a_completion_claim":true,"domains":[{"name":"科学史与经典实验","target":40},{"name":"数学工具与形式体系","target":40},{"name":"核心原理与测量","target":40},{"name":"原子、分子与相互作用","target":40},{"name":"近似方法、散射与对称性","target":35},{"name":"凝聚态与多体","target":30},{"name":"量子信息与计算","target":35},{"name":"通信、精密测量与实际应用","target":20},{"name":"相对论量子论与场论导览","target":25},{"name":"诠释与科学哲学","target":20},{"name":"量子生物与意识研究","target":15},{"name":"公众传播、灵性用语与争议溯源","target":20}],"missing":["中、英、日、德、法等多语种系统检索","历史原件、馆藏与 DOI Crosswalk","可追溯的事件地点与动态地理图","KOL原话及传播谱系","逐条授权的外部图片与视频","研究者独立复核","截至今日的前沿系统综述"]},"relationships":[{"from":"Q004","type":"demonstrates","to":"Q003"},{"from":"Q003","type":"explained_using","to":"Q007"},{"from":"Q019","type":"affects_visibility_of","to":"Q003"},{"from":"Q015","type":"tests_constraints_on","to":"Q014"},{"from":"Q017","type":"uses_resource","to":"Q014"},{"from":"Q021","type":"requires_distinction_from","to":"Q020"},{"from":"S15","type":"constrains_specific_models_of","to":"Q021"},{"from":"S16","type":"proposes_specific_mechanism_for","to":"Q021"}]}</script>
<script id="english-data" type="application/json">{"version":"0.2.0","entries":{"Q001":["Can light be detected one packet at a time?","Light exchanges energy with matter in quantized ways. A photon with a definite frequency has energy E = hf.","Dim the incoming light: a sensitive detector may still register discrete events.","The dots in illustrations do not mean photons are tiny solid balls with defined surfaces."],"Q002":["Is it a particle, or is it a wave?","Quantum objects can exhibit interference and be detected as discrete events. Classical balls and water waves are each only partial analogies.","Each detection makes one dot; many detections can build an interference pattern.","An object does not switch between a classical ball and a classical wave because of someone's thoughts."],"Q003":["How can two possibilities cancel each other?","For indistinguishable alternatives, add probability amplitudes before taking the squared magnitude. Relative phase can enhance some outcomes and suppress others.","Change the phase in the double-slit model and watch the bright and dark bands move.","Classical waves also interfere. Interference alone does not establish a uniquely quantum effect."],"Q004":["One particle at a time. Why do stripes appear?","When two paths remain coherent, discrete detections can accumulate into an interference pattern. Distinguishable path information can reduce its visibility.","Switch the path detector on and off, then accumulate more simulated detections.","This is sampling from a specified model, not live experimental data. A conscious person need not watch the detector."],"Q005":["How do we describe a system before predicting it?","A quantum state organizes predictions for measurement statistics. It is not simply a list of classical properties such as position and velocity.","Prepare the same state repeatedly, perform the same measurement, and compare outcome frequencies.","Interpretations differ on whether a quantum state describes reality itself, knowledge, or something else."],"Q006":["Is a probability cloud a real cloud of mist?","A wavefunction represents probability amplitudes in a chosen representation. For position measurements, its squared magnitude is a probability density.","Two wavefunctions can have different phases even when their position probability densities agree at one instant.","A wavefunction is generally complex-valued. It is not a vibration diagram of air, water, or spiritual matter."],"Q007":["How do we turn possibilities into testable numbers?","For a normalized state, an outcome's probability is the squared magnitude of its amplitude. Integrating a probability density over an interval gives that interval's probability.","Squaring the sum of two path amplitudes differs from simply adding their probabilities.","This statistical rule does not let us freely choose the next random outcome."],"Q008":["Does a physical observer have to be a person?","Measurement couples a system to an apparatus and produces a record. Standard calculations do not require human consciousness as an additional physical variable.","An automatic detector records data that a person reads later.","How a definite outcome arises raises interpretive questions. This does not establish that intention controls external outcomes."],"Q009":["Why can't both distributions become arbitrarily narrow?","Position and momentum standard deviations obey Δx Δp ≥ ℏ/2. A minimum-uncertainty Gaussian state attains equality.","Adjust the Gaussian width: as the position distribution narrows, the momentum distribution broadens.","This is a statistical constraint on particular observables, not a claim that everything is unknowable."],"Q010":["Why call it spin if it isn't a spinning ball?","Spin is an intrinsic form of angular momentum. The 1922 Stern–Gerlach experiment showed discrete splitting of a silver-atom beam.","Measuring a spin-one-half system along a chosen axis gives one of two possible outcomes.","Electron spin cannot be fully understood as a small classical ball rotating about an axis."],"Q011":["Why do atoms absorb particular colors?","Atomic bound states have discrete energy levels. An absorbed or emitted photon can carry the energy difference between two levels.","Use stairs to picture discrete values, then return to energy differences and photon energy.","Stairs are only an analogy. Not every energy in every quantum system has a discrete spectrum."],"Q012":["Can something appear beyond a barrier it cannot climb?","Under suitable conditions, a quantum state extends into a classically forbidden region and has a nonzero transmission probability beyond a barrier.","Vary a model barrier's width and compare transmission probabilities.","This does not imply people can walk through walls by intention. Probabilities depend on the actual system and barrier."],"Q013":["Can we tell two electrons apart by giving them names?","Exchange symmetry affects multiparticle states and their statistics. Bosons and fermions obey different exchange rules.","Move beyond labelled classical balls toward a description without individual classical identity tags.","Indistinguishability does not mean all different kinds of particles are the same."],"Q014":["When does a correlation go beyond the classical?","Entanglement is a quantum correlation that cannot be described by a separable state. Always matching or always opposing results alone do not distinguish it from classical correlation.","Compare joint statistics across several measurement settings, not a single coincidence.","Entanglement is not physical evidence for emotional affinity or soulmates."],"Q015":["How can a philosophical debate meet an experiment?","Under explicit assumptions, including locality and measurement-setting independence, Bell inequalities constrain correlations in certain classical models. Experiments test for violations.","The CHSH model compares the local bound of 2 with the ideal quantum value 2√2.","A plotted violation is not a new experiment. Real tests must address detection, locality, and other loopholes."],"Q016":["Can a correlation send an instant message?","One side's local outcomes alone do not reveal a freely chosen message from the other side. Comparing or using correlations still requires appropriate communication.","Change the distant setting: the theoretical probabilities on one side remain one half each.","Nonclassical correlations do not provide controllable faster-than-light communication."],"Q017":["What is teleported: an object, or a state?","Quantum teleportation uses shared entanglement, measurement, and classical communication to transfer an unknown quantum state to another system.","The receiver needs the sender's measurement result to complete the appropriate operation.","It does not transport a whole person or eliminate the need for classical messages."],"Q018":["What is the smallest unit of quantum information?","A qubit is described by a two-dimensional quantum system. Relative to a chosen basis, its state can be a superposition of the two basis states.","Two energy levels or polarization states can illustrate an abstract two-state system.","A single measurement does not reveal all the amplitudes as readable classical answers."],"Q019":["Why don't we see interference everywhere?","Interaction with the environment can reduce locally observable coherence. Environmental records make certain interference effects harder to observe.","Lower the visibility to fade the stripes. This is a phenomenological model, not a microscopic calculation.","Decoherence calculations do not automatically settle the problem of a single measurement outcome for every interpretation."],"Q020":["Does predicting correctly mean we understand everything?","Different frameworks interpret the relationships among quantum states, measurement, and reality. Testable predictions must be distinguished from ontological explanations.","Ask whether competing accounts predict different results, then compare their interpretations and additional assumptions.","Unresolved interpretive questions do not establish arbitrary supernatural claims."],"Q021":["Has anyone studied quantum processes in the brain?","Researchers have proposed mechanisms for quantum processing in the brain and calculated decoherence constraints on particular brain processes. Each model needs its own evaluation.","Read Fisher's nuclear-spin proposal alongside Tegmark's decoherence analysis, noting that they are not a direct controlled comparison of the same model.","These selected historical papers are not a current systematic review and do not establish a quantum explanation of consciousness."],"Q022":["Is a high-frequency mood a physical frequency?","For a photon of definite frequency, E = hf relates its energy and frequency. Using the same word for an emotion requires a separate definition.","Photon frequencies can be measured. Describing a mood as high-frequency usually serves a different linguistic purpose.","The photon equation does not establish that emotions change wealth, health, or other people's behavior through this mechanism."],"Q023":["Does linking a paper make a claim proven?","Distinguish experimental reports, theoretical proposals, reviews, and explainers. Then ask exactly which statement a source supports. A paper's existence does not equal independent confirmation.","An experimental abstract reports a measured correlation; a theoretical abstract proposes a possible mechanism. They need different evidence labels.","Source type and a claim's evidential status are separate fields. An institution's name is not a guarantee of a conclusion."],"Q024":["How does a quantum state change with time?","Within its domain of validity, the Schrödinger equation describes the time evolution of a quantum state. It requires an initial state and the system's Hamiltonian.","Given a potential and an initial wavefunction, calculate a later probability distribution and compare it with observations.","This is not a formula that turns wishes into outcomes. Nonrelativistic models also have limits of applicability."]},"categories":[["Light & waves","Begin with observable patterns"],["Quantum rules","A different language for nature"],["Atoms & matter","Small scales, big differences"],["Correlations & information","What entanglement can do"],["Consciousness & boundaries","Open questions, explicit evidence"],["Reading science","Concepts, evidence, and metaphor"]],"bridges":[["Does the observer effect mean consciousness creates reality?","Physics and philosophical questions","Quantum measurement involves recordable physical interactions. Standard calculations do not require consciousness as an extra variable. Interpretations can be discussed without concluding that intention controls results."],["Does entanglement prove telepathy?","This conclusion does not follow","Entanglement has precise preparation, measurement, and statistical requirements. It does not automatically apply to personal rapport or let one party read a faster-than-light message from local outcomes alone."],["Is raising your frequency the same as E = hf?","Separate metaphor from measurable quantities","Photon energy and frequency have a defined relationship. Frequency as a description of mood or values may be expressive language, but that does not make it the same physical quantity."],["Is quantum consciousness an unstudied question?","Theoretical research is not confirmation","There are proposals for quantum processing in the brain and analyses of decoherence constraints. We label each model, author, and evidence status rather than turning a debate into a completed proof."],["Does uncertainty mean any wish can come true?","A statistical constraint is not a wish mechanism","Uncertainty relations constrain distributions of specific observables. Probabilities depend on states and experimental conditions; they are not arbitrary probabilities for anything we can imagine."],["Can I value spiritual experience while learning science?","Our editorial approach","You can begin with your own questions and experiences. We distinguish subjective experience, cultural meaning, philosophical views, and testable physical claims. Respecting an experience does not automatically establish a particular mechanism."]],"timeline":[["One beam, two discrete paths","The Stern–Gerlach experiment enters this learning trail: how did it challenge classical intuitions about angular momentum?"],["A new quantum description takes shape","Feynman's historical introduction identifies 1926–1927 as a key period in forming a consistent quantum description. This is a period marker, not an exact date for one event."],["Estimating constraints on brain-based quantum processes","Tegmark's paper appeared as a preprint in 1999 and in a journal in 2000. It estimates decoherence for particular modeled brain processes."],["Why does the world often look classical?","Zurek's review of decoherence was published in 2003; the first arXiv version was submitted in 2001."],["Making a Bell test more rigorous","Giustina and colleagues reported a photonic Bell test closing major loopholes simultaneously. We link the paper but have not reanalyzed its raw data."],["Another proposal for quantum processing in the brain","Fisher proposed a possible mechanism involving nuclear spins and particular molecules. A research proposal is not a confirmed mechanism of consciousness."]],"source_limits":{"S07":"This page uses strong interpretive language about measurement. We do not present one ontological interpretation as a consensus across all interpretations.","S15":"The estimates apply to the modeled degrees of freedom and parameters, not automatically to every possible quantum mechanism in a brain.","S16":"A proposed research mechanism is not confirmation that human consciousness arises through it.","S19":"This external simulation is linked, not integrated or tested within this site."},"domains":["Scientific history and classic experiments","Mathematical tools and formalism","Core principles and measurement","Atoms, molecules, and interactions","Approximations, scattering, and symmetries","Condensed matter and many-body physics","Quantum information and computing","Communication, sensing, and applications","Relativistic quantum theory and field theory","Interpretations and philosophy of science","Quantum biology and consciousness","Public discourse, spiritual vocabulary, and claim tracing"],"missing":"Multilingual systematic searches; original-document, version, and archive crosswalks; event geography; public and creator claim provenance; licensed media; independent expert review; a current systematic review of frontier research."}</script>

function renderLab(){const titles=t(['双缝实验','相位与干涉','不确定性','纠缠与贝尔'],['Double slit','Phase & interference','Uncertainty','Entanglement & Bell']),sub=t(['让探测点累积成图样','观察振幅增强与抵消','收窄一个分布','改变测量角度'],['Build a pattern, one dot at a time','Add amplitudes, change the phase','Narrow one distribution','Change the measurement angle']);const i=labIds.indexOf(lab);$('#labtabs').innerHTML=labIds.map((v,j)=>`<button class="labtab ${lab===v?'active':''}" data-lab="${v}" aria-pressed="${lab===v}"><b>0${j+1} / ${titles[j]}</b><small>${sub[j]}</small></button>`).join('');$('#labTitle').textContent=t(['一个个点，怎样变成条纹？','把两个振幅相加','一边收窄，另一边展开','关联不只是同时发生'][i],['How do individual dots become stripes?','Add two amplitudes','Narrow one side. Broaden the other.','Correlation is more than coincidence'][i]);$('#labDesc').textContent=entry(labEntries[i]).summary;let c='';if(lab==='slits')c=range('phase',t('相位 φ','Phase φ')+' / 0–360°',0,360,phase)+range('visibility',t('可见度 V','Visibility V')+' / 0–100%',0,100,visibility)+`<label class="toggle"><input id="detector" data-control="detector" type="checkbox" ${detector?'checked':''}>${t('路径可区分','Distinguishable paths')}</label><button class="btn quiet" data-action="one">${t('发射 1 次','Emit 1')}</button><button class="btn quiet" data-action="many">${t('累积 200 次','Emit 200')}</button><button class="btn quiet" data-action="clear">${t('清空','Clear')}</button>`;if(lab==='phase')c=range('phase',t('相对相位 φ','Relative phase φ')+' / 0–360°',0,360,phase);if(lab==='uncertainty')c=range('width',t('位置标准差 Δx','Position standard deviation Δx'),.3,2,width,.01);if(lab==='bell')c=range('theta',t('测量角度 θ','Measurement angle θ')+' / 0–90°',0,90,theta)+`<button class="btn quiet" data-action="pairs">${t('模拟 1000 对结果','Sample 1,000 pairs')}</button>`;$('#controls').innerHTML=c;
const foot=t(['高斯包络教学模型：p(x) ∝ exp(−x²/4.5)[1 + V cos(6x + φ)]，在可见窗口内归一化。路径可区分时设 V=0。修改条件会清空旧样本。','正弦振幅 sin(x) + sin(x + φ) 的数学示意，合振幅为 2|cos(φ/2)|。经典波也会干涉；这不是概率密度。','仅演示最小不确定度高斯态。无量纲单位 ℏ=1，Δp=1/(2Δx)，乘积为0.5。一般态满足不等式，不保证取等号。','理想自旋单态 E(a,b)=−cos(a−b)。A=0°，A′=90°，B=θ，B′=−θ，|S|=2|cosθ+sinθ|。局域界限2依赖测量设置独立性等假设。单侧理论概率各为1/2。模拟不是实际贝尔检验。'],['Gaussian-envelope teaching model: p(x) ∝ exp(−x²/4.5)[1 + V cos(6x + φ)], normalized over the visible window. Distinguishable paths set V=0. Changing conditions clears old samples.','A mathematical illustration of sin(x) + sin(x + φ), with combined amplitude 2|cos(φ/2)|. Classical waves also interfere. This is not a probability density.','Minimum-uncertainty Gaussian states only. With dimensionless ℏ=1, Δp=1/(2Δx), giving a product of 0.5. General states obey an inequality and need not attain equality.','Ideal spin singlet: E(a,b)=−cos(a−b). A=0°, A′=90°, B=θ, B′=−θ, |S|=2|cosθ+sinθ|. The local bound of 2 assumes setting independence and other conditions. Each local theoretical outcome has probability 1/2. This simulation is not an experimental Bell test.']);$('#labFoot').innerHTML=esc(foot[i])+'<br>'+srcLinks(labSources[i]);drawLab()}
function addHits(n){if(hits.length+n>10000){$('#pairStats').textContent=t('本轮上限10000次，请清空后继续。','Limit: 10,000 detections. Clear the samples to continue.');return}const p=phase*Math.PI/180,v=detector?0:visibility/100,cdf=[];let sum=0;for(let i=0;i<1000;i++){const x=-4+8*(i+.5)/1000;sum+=Math.exp(-x*x/4.5)*(1+v*Math.cos(6*x+p));cdf.push(sum)}for(let i=0;i<n;i++){const r=Math.random()*sum;let lo=0,hi=999;while(lo<hi){const m=(lo+hi)>>1;cdf[m]<r?lo=m+1:hi=m}hits.push([60+700*(lo+Math.random())/1000,235+Math.random()*69])}drawLab()}
function samplePairs(){const E=-Math.cos(theta*Math.PI/180);pairs={a:0,b:0,same:0};for(let i=0;i<1000;i++){const a=Math.random()<.5?1:-1,b=Math.random()<(1+E)/2?a:-a;pairs.a+=a===1;pairs.b+=b===1;pairs.same+=a===b}drawLab()}
function drawLab(){const canvas=$('#experiment');if(!canvas)return;const c=canvas.getContext('2d'),purple='#bb9efb',gold='#e6bd80',cyan='#70d9e0',muted='#a9b5cf';c.setTransform(1.5,0,0,1.5,0,0);c.clearRect(0,0,820,340);c.lineWidth=1;c.textAlign='left';function txt(s,x,y,color=muted,size=12){c.fillStyle=color;c.font=size+'px sans-serif';c.fillText(s,x,y)}function line(x,y,X,Y,col='#354260',dash=[]){c.strokeStyle=col;c.setLineDash(dash);c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();c.setLineDash([])}function curve(fn,y,s,col){c.strokeStyle=col;c.lineWidth=2;c.beginPath();for(let i=0;i<=700;i++){const a=-4+8*i/700;i?c.lineTo(60+i,y-s*fn(a)):c.moveTo(60+i,y-s*fn(a))}c.stroke();c.lineWidth=1}$('#pairStats').textContent='';let value='';
if(lab==='slits'){const v=detector?0:visibility/100;txt(t('理论分布（相对形状）','Theoretical distribution (relative shape)'),60,29);line(60,201,760,201);curve(x=>Math.exp(-x*x/4.5)*(1+v*Math.cos(6*x+phase*Math.PI/180)),201,74,purple);txt(t('模拟探测事件','Simulated detection events'),60,222);txt(t('屏幕位置 x →','Screen position x →'),630,222);c.fillStyle=cyan;c.globalAlpha=.65;hits.forEach(([x,y])=>{c.beginPath();c.arc(x,y,1.4,0,Math.PI*2);c.fill()});c.globalAlpha=1;line(60,310,760,310);txt(v===0?t('路径可区分：本模型无干涉条纹','Distinguishable paths: no interference in this model'):t('路径保持相干：可见干涉条纹','Coherent paths: interference is visible'),60,331,muted,11);value=t('已累积 ','Detections: ')+hits.length+' · V = '+v.toFixed(2)+' · φ = '+phase+'°'}
if(lab==='phase'){const p=phase*Math.PI/180;line(60,180,760,180);curve(x=>Math.sin(2*x),180,59,'#6c769b');curve(x=>Math.sin(2*x+p),180,59,gold);curve(x=>Math.sin(2*x)+Math.sin(2*x+p),180,59,purple);txt(t('灰紫：振幅1　金色：振幅2　亮紫：两者之和','Muted: amplitude 1   Gold: amplitude 2   Violet: their sum'),60,30);txt(t('数学示意，不是概率密度。','Mathematical illustration—not a probability density.'),60,321);value='φ = '+phase+'° · '+t('合振幅 = ','Combined amplitude = ')+(2*Math.abs(Math.cos(p/2))).toFixed(2)}
if(lab==='uncertainty'){const dp=.5/width,g=s=>x=>Math.exp(-x*x/(2*s*s))/(s*Math.sqrt(2*Math.PI));line(60,153,760,153);line(60,308,760,308);curve(g(width),153,77,purple);curve(g(dp),308,77,gold);txt(t('位置概率密度 p(x)','Position probability density p(x)'),60,27,purple);txt(t('动量概率密度 p(p)','Momentum probability density p(p)'),60,184,gold);[168,329].forEach(y=>{txt('−4',60,y);txt('0',408,y);txt('+4',745,y)});value='Δx = '+width.toFixed(2)+' · Δp = '+dp.toFixed(2)+' · ΔxΔp = 0.50'}
if(lab==='bell'){const r=theta*Math.PI/180,S=2*Math.abs(Math.cos(r)+Math.sin(r)),px=x=>60+700*x/90,py=x=>286-74*x;line(60,286,760,286);line(60,py(2),760,py(2),gold,[5,5]);txt(t('局域模型界限 2','Local-model bound: 2'),60,py(2)-12,gold);c.strokeStyle=purple;c.lineWidth=2;c.beginPath();for(let i=0;i<=180;i++){const q=i/2,y=py(2*(Math.cos(q*Math.PI/180)+Math.sin(q*Math.PI/180)));i?c.lineTo(px(q),y):c.moveTo(px(q),y)}c.stroke();c.lineWidth=1;line(px(theta),py(S),px(theta),286,'#6c668a',[3,4]);c.fillStyle=cyan;c.beginPath();c.arc(px(theta),py(S),5,0,Math.PI*2);c.fill();txt(t('|S|：理想量子模型的 CHSH 曲线','|S|: CHSH curve for the ideal quantum model'),60,29);txt('θ = 0°',60,311);txt('45°',400,311);txt('90°',730,311);value='θ = '+theta+'° · |S| = '+S.toFixed(3)+' · '+t('单侧理论概率各50%','Local theoretical outcomes: 50% each');if(pairs)$('#pairStats').textContent=t(`仅A=0°、B=${theta}°的1000对样本：A+ ${pairs.a}次，B+ ${pairs.b}次，同号${pairs.same}次。不是四组实验测得的S。`,`1,000 pairs at A=0°, B=${theta}° only: A+ ${pairs.a}; B+ ${pairs.b}; same sign ${pairs.same}. This is not S estimated from four experimental settings.`)}$('#labValue').textContent=value}
function switchLang(next){if(next===lang)return;const y=scrollY;lang=next;store('quri-language',lang);try{const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}catch{}render();requestAnimationFrame(()=>scrollTo({top:y,behavior:'instant'}))}
function exportMap(){const clone=$('#atlasSvg').cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('font-family','system-ui, PingFang SC, sans-serif');clone.querySelectorAll('[tabindex]').forEach(e=>e.removeAttribute('tabindex'));const u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='QuriAtlas-map-'+lang+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',ev=>{const b=ev.target.closest('button,[data-map]');if(!b)return;if(b.dataset.lang)return switchLang(b.dataset.lang);if(b.dataset.entry)return openEntry(b.dataset.entry);if(b.dataset.read){read.add(b.dataset.read);store('quri-read-v1',JSON.stringify([...read]));renderPath();renderCards();return openEntry(b.dataset.read)}if(b.dataset.path){pathId=b.dataset.path;return renderPath()}if(b.dataset.cat){category=b.dataset.cat;return renderCards()}if(b.dataset.map){category=b.dataset.map;renderCards();return $('#filters').scrollIntoView({behavior:still?'auto':'smooth'})}if(b.dataset.lab){lab=b.dataset.lab;return renderLab()}if(b.dataset.time!==undefined){timeIndex=+b.dataset.time;return renderTime()}switch(b.dataset.action){case'close':$('#entryDialog').close();opened=null;break;case'motion':still=!still;store('quri-motion',still?'off':'on');document.body.classList.toggle('still',still);document.documentElement.classList.toggle('still',still);b.textContent=still?t('动效：关','Motion: off'):t('动效：开','Motion: on');b.setAttribute('aria-pressed',String(still));break;case'reset':read.clear();store('quri-read-v1','[]');renderPath();renderCards();break;case'export':exportMap();break;case'one':addHits(1);break;case'many':addHits(200);break;case'clear':hits=[];drawLab();break;case'pairs':samplePairs();break}});
document.addEventListener('input',ev=>{const el=ev.target,id=el.dataset.control;if(!id)return;if(id==='phase')phase=+el.value;if(id==='visibility')visibility=+el.value;if(id==='detector'){detector=el.checked;$('#visibility').disabled=detector}if(id==='width')width=+el.value;if(id==='theta')theta=+el.value;hits=[];pairs=null;drawLab()});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-map]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#entryDialog').addEventListener('close',()=>opened=null);$('#entryDialog').addEventListener('click',e=>{if(e.target===$('#entryDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderMap,150)});render();window.QURI_BUILD='0.4.0-atlantis-cinematic';
