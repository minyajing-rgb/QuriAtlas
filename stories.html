等于已证实人脑通过该机制产生意识。"},{"id":"S17","title":"Significant-loophole-free test of Bell's theorem with entangled photons","author":"Marissa Giustina et al.","organization":"arXiv / Physical Review Letters","url":"https://arxiv.org/abs/1511.03190","kind":"experimental_paper","level":"A","publication_year":2015,"access":"abstract_and_linked_fulltext","review":"abstract_and_metadata","data_access":"摘要页说明实验数据可向通讯作者索取；本项目未取得原始数据。"},{"id":"S18","title":"The Quantum Atlas — About","organization":"University of Maryland / JQI","url":"https://quantumatlas.umd.edu/about/","kind":"project_self_description","level":"A","access":"open_html","review":"page_text","role":"同类产品与品牌重名检查，不作为物理事实的直接证据。"},{"id":"S19","title":"Quantum Wave Interference","organization":"PhET, University of Colorado Boulder","url":"https://phet.colorado.edu/en/simulations/quantum-wave-interference","kind":"simulation_catalog","level":"C","access":"external_simulation","review":"catalog_page","limitation":"外部模拟未在本站内集成或运行验收。"},{"id":"S20","title":"The Quantum Atlas — Get Started","organization":"University of Maryland / JQI","url":"https://quantumatlas.umd.edu/start/","kind":"institutional_learning_path","level":"C","access":"open_html","review":"page_text"}],"entries":[{"id":"Q001","title":"光子","en":"Photon","category":"light","hook":"光可以一份一份地被探测吗？","summary":"光与物质交换能量时呈现量子化特征。对频率确定的光子，能量满足 E = hf。","example":"把入射光减弱，敏感探测器仍可能记录一个个离散事件。","limit":"图上的小光点是示意，不代表光子是一颗有确定表面的微型球。","source_ids":["S05"],"next":["Q002","Q022"]},{"id":"Q002","title":"波粒二象性","en":"Wave–particle duality","category":"light","hook":"它到底是一颗粒子，还是一道波？","summary":"量子对象能表现出干涉，也能以离散事件被探测。经典小球和水波都只是部分适用的类比。","example":"屏幕每次出现一个点，许多次事件却形成干涉分布。","limit":"不是对象根据人的意念在经典球和经典波之间变身。","source_ids":["S01","S02"],"next":["Q004"]},{"id":"Q003","title":"干涉","en":"Interference","category":"light","hook":"两种可能性，为什么可以互相抵消？","summary":"无法区分的路径要先相加概率振幅，再取模平方。相位关系能让某些结果更常见，也能压低另一些结果。","example":"改变本页双缝模型的相位，明暗条纹会移动。","limit":"水波也会干涉；看到干涉并不自动证明某个系统发生了特有的量子效应。","source_ids":["S01","S06"],"next":["Q007"]},{"id":"Q004","title":"双缝实验","en":"Double-slit experiment","category":"light","hook":"一次只发一个，为什么最后还有条纹？","summary":"保持两条路径的相干性时，离散探测事件可以累积成干涉图样。路径信息变得可区分时，干涉可见度会降低。","example":"在互动实验中切换路径探测器，再累积更多探测点。","limit":"这里是预设模型的随机采样，不是现场实验数据；不需要一个有意识的人盯着仪器。","source_ids":["S01","S06"],"next":["Q008","Q019"]},{"id":"Q005","title":"量子态","en":"Quantum state","category":"rules","hook":"预测之前，先怎样描述这个系统？","summary":"量子态组织了系统可被预测的测量统计。它不是把位置和速度等经典属性简单罗列在一起。","example":"准备相同的态，再做许多次相同测量，比较结果频率。","limit":"关于量子态究竟代表现实本身还是知识，不同诠释有不同回答。","source_ids":["S09"],"next":["Q006","Q018"]},{"id":"Q006","title":"波函数","en":"Wavefunction","category":"rules","hook":"那片概率云，是一团真的雾吗？","summary":"波函数是在某种表象中描述量子态的概率振幅。对位置测量，模平方给出概率密度。","example":"波函数可以有不同相位，即使某一时刻的位置概率密度相同。","limit":"它一般是复数函数，不是空气、水或灵性物质的振动图。","source_ids":["S03"],"next":["Q007","Q024"]},{"id":"Q007","title":"玻恩规则","en":"Born rule","category":"rules","hook":"怎样把可能性变成可以比较的数字？","summary":"对规范化的态，测得某一结果的概率由对应振幅的模平方给出。概率密度要在一个区间积分才得到区间概率。","example":"双缝两条路径的振幅相加后平方，不等于两份概率直接相加。","limit":"这条统计规则不让我们随意选择下一次随机结果。","source_ids":["S01","S03"],"next":["Q008"]},{"id":"Q008","title":"量子测量","en":"Quantum measurement","category":"rules","hook":"物理学里的观察者，一定是人吗？","summary":"测量把系统和装置联系起来，产生可记录的结果。标准计算不需要把人的意识另加为一个物理变量。","example":"自动探测器记录数据，之后再由人读取。","limit":"测量结果如何出现仍涉及基础诠释问题；不能由此推出意念可控制外界结果。","source_ids":["S07","S14"],"next":["Q019","Q020"]},{"id":"Q009","title":"不确定性关系","en":"Uncertainty relation","category":"rules","hook":"为什么两张分布图不能同时无限收窄？","summary":"位置和动量的标准差满足 Δx Δp ≥ ℏ/2。最小不确定度高斯态恰好达到等号。","example":"拖动本页高斯态宽度：位置分布变窄，动量分布变宽。","limit":"这是特定可观测量的统计约束，不是任何事情都无法确定。","source_ids":["S02"],"next":["Q006"]},{"id":"Q010","title":"自旋","en":"Spin","category":"matter","hook":"不是真的自转，为什么还叫自旋？","summary":"自旋是量子对象的内禀角动量属性。1922 年的 Stern–Gerlach 实验显示银原子束产生离散分裂。","example":"对自旋二分之一系统，沿某方向测量会得到两种可能结果。","limit":"不能把电子自旋完全理解成一个小球绕轴旋转。","source_ids":["S08"],"next":["Q018"]},{"id":"Q011","title":"能级","en":"Energy levels","category":"matter","hook":"原子为什么只吸收某些颜色？","summary":"原子的束缚态具有离散能级。吸收或发射的光子能量可与两个能级的差对应。","example":"用楼梯帮助理解离散取值，再回到能级差与光子能量。","limit":"楼梯只是类比；不是说所有量子系统的全部能量都只能离散取值。","source_ids":["S05","S13"],"next":["Q022"]},{"id":"Q012","title":"量子隧穿","en":"Quantum tunneling","category":"matter","hook":"能量不够翻过去，也能在另一侧被发现？","summary":"在某些势垒条件下，量子态可以在经典禁阻区延伸，并在势垒另一侧具有非零透射概率。","example":"把势垒宽度当作可调参数，比较透射变化。","limit":"不能据此认为人体可凭意念穿墙；具体概率由物理系统与势垒决定。","source_ids":["S09","S13"],"next":["Q024"]},{"id":"Q013","title":"全同粒子","en":"Identical particles","category":"matter","hook":"两个电子换个位置，能靠标签分开吗？","summary":"全同量子粒子的交换对称性会影响多粒子态及其统计行为。玻色子与费米子的处理不同。","example":"从给小球贴名字的直觉，走向不能逐个经典标记的多粒子描述。","limit":"不可区分不意味着所有不同类型粒子都相同。","source_ids":["S04"],"next":["Q005"]},{"id":"Q014","title":"量子纠缠","en":"Entanglement","category":"information","hook":"两边的结果怎样超出普通的相关？","summary":"纠缠是一类不能用可分离态表达的量子关联。只展示两边总相同或总相反，并不足以区分它与经典相关。","example":"比较多个测量设置下的联合统计，而不是只看一次巧合。","limit":"纠缠不是情感默契或灵魂伴侣的物理证据。","source_ids":["S11"],"next":["Q015","Q016"]},{"id":"Q015","title":"贝尔检验","en":"Bell test","category":"information","hook":"怎样让一场哲学争论接受实验检验？","summary":"在明确的局域性、测量设置独立性等假设下，某些经典模型的关联受贝尔不等式约束。实验可检验其是否被违反。","example":"本页 CHSH 模型显示经典界限 2 与理想量子值 2√2。","limit":"模型画出违反并不是新实验；真实检验还要处理探测和局域性等漏洞。","source_ids":["S11","S17"],"next":["Q016"]},{"id":"Q016","title":"不能靠纠缠超光速传信","en":"No-signalling","category":"information","hook":"既然有关联，能不能瞬间发一条消息？","summary":"只观察一侧的局部结果，不能读出另一侧自由选择的信息。要利用或比较关联，仍需合适的通信与数据比较。","example":"在纠缠互动中转动另一侧设置，单侧结果的理论概率仍为一半。","limit":"非经典关联不等于可控制的超光速通信。","source_ids":["S10","S11"],"next":["Q017"]},{"id":"Q017","title":"量子隐形传态","en":"Quantum teleportation","category":"information","hook":"传过去的是物体，还是量子态？","summary":"协议利用共享纠缠、测量和经典通信，将未知量子态转移到另一个系统。","example":"接收端需要知道发送端的测量结果，才能完成相应操作。","limit":"不是搬运整个人；也不是不经过经典消息的瞬时传送。","source_ids":["S10","S11"],"next":["Q018"]},{"id":"Q018","title":"量子比特","en":"Qubit","category":"information","hook":"最小的量子信息单位怎样理解？","summary":"量子比特用二维量子系统描述。相对于选定基底，其态可具有两个基态的叠加。","example":"用两个能级或偏振自由度帮助理解抽象的两态系统。","limit":"一次测量不会把叠加里的全部振幅作为可读经典答案交出来。","source_ids":["S09","S11","S20"],"next":["Q014"]},{"id":"Q019","title":"退相干","en":"Decoherence","category":"frontier","hook":"为什么日常生活看不见那么多干涉？","summary":"系统与环境相互作用，会让局部可见的相干性降低。环境记录使某些干涉更难观察。","example":"调低本页可见度，条纹变淡；这只是相干性降低的现象模型。","limit":"退相干的计算不自动替所有诠释解决单一测量结果问题。","source_ids":["S14"],"next":["Q020"]},{"id":"Q020","title":"测量问题与诠释","en":"Measurement problem","category":"frontier","hook":"算得准，是否就代表我们已知道一切？","summary":"关于量子态、测量及现实之间的关系，有不同解释框架。可检验的预测与本体论解释要分开。","example":"先问各方是否预测不同实验结果，再比较其解释与额外假设。","limit":"未解决的诠释问题不等于任何超自然主张都已获得支持。","source_ids":["S07","S14"],"next":["Q021","Q023"]},{"id":"Q021","title":"量子与意识研究","en":"Quantum and consciousness research","category":"frontier","hook":"有人认真研究过这个问题吗？","summary":"有研究者提出脑内量子处理机制，也有人计算特定脑过程中的退相干约束。不同模型必须分别评估。","example":"并读 Fisher 的核自旋机制提案与 Tegmark 的退相干分析，明确它们并非同一模型的直接对照实验。","limit":"这里介绍历史论文的提案与争论，不声称已完成截至今日的系统综述，也不声称量子意识被证实。","source_ids":["S15","S16"],"next":["Q019","Q023"]},{"id":"Q022","title":"能量与频率","en":"Energy and frequency","category":"method","hook":"物理学里的高频，和感觉里的高频是一回事吗？","summary":"对频率确定的光子，E = hf 将能量与频率连接起来。把同一个词用于情绪时，需要另外定义其意义。","example":"红光、蓝光的光子频率可测；描述心情的高频通常是另一种语言用途。","limit":"不能直接用光子的公式推出情绪高低能改变财富、健康或他人的行为。","source_ids":["S05","S02"],"next":["Q023"]},{"id":"Q023","title":"如何读证据","en":"Reading evidence","category":"method","hook":"一段话有论文链接，就已经被证实了吗？","summary":"先分清实验报告、理论提案、综述和科普，再看来源究竟支持哪一句话。存在一篇论文不等于结论得到独立验证。","example":"实验摘要说测到了某种相关；理论摘要说提出一种可能机制。两者不能使用同一种证据标签。","limit":"来源等级和主张是否成立是两个字段；不把机构名当作结论的担保。","source_ids":["S15","S16","S17"],"next":["Q015","Q021"]},{"id":"Q024","title":"薛定谔方程","en":"Schrödinger equation","category":"rules","hook":"量子态随时间怎样变化？","summary":"在适用范围内，薛定谔方程给出量子态的时间演化。需要指定初始态与系统的哈密顿量。","example":"给定势能与初始波函数，计算之后的概率分布，再与实验比较。","limit":"不是输入愿望并生成结果的公式；非相对论模型也有自己的适用边界。","source_ids":["S03","S12"],"next":["Q006","Q012"]}],"bridges":[{"id":"B01","question":"观察者效应，是意识创造现实吗？","label":"物理概念与哲学追问","answer":"量子测量涉及可记录的物理相互作用；标准计算不要求人的意识作为额外变量。测量的解释可以讨论，但不能直接推出意念控制结果。","source_ids":["S07","S14"],"related":["Q008","Q020"]},{"id":"B02","question":"纠缠，能证明心灵感应吗？","label":"不能由此推出","answer":"量子纠缠有严格的制备、测量和统计含义。它不自动适用于两个人的主观默契，也不能让一方通过单侧结果读出另一方发送的超光速消息。","source_ids":["S10","S11"],"related":["Q014","Q016"]},{"id":"B03","question":"提升频率，和 E = hf 是同一回事吗？","label":"隐喻与可测量量分开","answer":"光子能量与频率有明确关系。描述心情、状态或价值观的频率，可以作为自我表达，但没有因此成为同一个物理量。","source_ids":["S05","S02"],"related":["Q022"]},{"id":"B04","question":"量子与意识，是完全没人研究吗？","label":"有理论研究，不等于已证实","answer":"确有脑内量子处理提案，也有关于退相干的反对分析。本站分别注明模型、作者与证据状态，不把争论写成已经完成的证明。","source_ids":["S15","S16"],"related":["Q021","Q023"]},{"id":"B05","question":"既然不确定，是否任何愿望都可能成真？","label":"统计约束不是愿望机制","answer":"不确定性关系约束特定可观测量的分布；概率也受状态和实验条件约束。它不意味着所有想象具有任意概率。","source_ids":["S02","S03"],"related":["Q009","Q007"]},{"id":"B06","question":"可以保留灵性体验，同时认真学科学吗？","label":"本站编辑原则","answer":"可以从自己的问题与体验出发。这里把主观体验、文化意义、哲学观点和可检验的物理主张分别记录：不嘲笑体验，也不把体验自动当作某个物理机制的证明。","source_ids":[],"related":["Q023"],"epistemic_status":"editorial_principle_not_experimental_claim"}],"timeline":[{"id":"T01","year":1922,"date_type":"experiment_year","title":"一束原子，分成离散的两路","text":"Stern–Gerlach 实验进入这条学习线：它如何改变我们对角动量的直觉？","source_ids":["S08"],"related":"Q010","geography_status":"not_yet_crosswalked"},{"id":"T02","year":1927,"date_type":"period_endpoint_1926_1927","title":"新的量子描述逐渐成形","text":"Feynman 的历史回顾把 1926–1927 年作为形成一致量子描述的关键时期；这里不是单一事件的精确日期。","source_ids":["S01"],"related":"Q024","geography_status":"multi_location_not_yet_crosswalked"},{"id":"T03","year":2000,"date_type":"journal_publication_year","title":"对脑内量子机制提出数量级约束","text":"Tegmark 的文章于 1999 年发布预印本，2000 年发表于期刊；关注特定脑过程的退相干估计。","source_ids":["S15"],"related":"Q021","geography_status":"publication_not_experiment_location"},{"id":"T04","year":2003,"date_type":"review_publication_year","title":"为什么世界常常看起来像经典的？","text":"Zurek 的退相干综述发表于 2003 年；其 arXiv 初版提交于 2001 年。","source_ids":["S14"],"related":"Q019","geography_status":"publication_not_experiment_location"},{"id":"T05","year":2015,"date_type":"paper_publication_year","title":"把贝尔检验做得更严格","text":"Giustina 等报告同时关闭主要漏洞的光子贝尔检验；本站提供论文入口，尚未复核原始实验数据。","source_ids":["S17"],"related":"Q015","geography_status":"not_yet_crosswalked"},{"id":"T06","year":2015,"date_type":"proposal_publication_year","title":"另一条脑内量子处理提案","text":"Fisher 提出核自旋与特定分子参与量子处理的可能机制；这是研究提案，不是意识机制已被证实。","source_ids":["S16"],"related":"Q021","geography_status":"publication_not_experiment_location"}],"learning_paths":[{"id":"beginner","title":"完全零基础","steps":["Q001","Q004","Q003","Q005","Q008","Q009","Q014","Q023"]},{"id":"spiritual","title":"从灵性问题出发","steps":["Q022","Q008","Q014","Q016","Q019","Q020","Q021","Q023"]},{"id":"research","title":"追到原始证据","steps":["Q023","Q007","Q015","Q019","Q021","Q024"]}],"expansion_plan":{"status":"planned_not_collected","target_canonical_entries":360,"not_a_completion_claim":true,"domains":[{"name":"科学史与经典实验","target":40},{"name":"数学工具与形式体系","target":40},{"name":"核心原理与测量","target":40},{"name":"原子、分子与相互作用","target":40},{"name":"近似方法、散射与对称性","target":35},{"name":"凝聚态与多体","target":30},{"name":"量子信息与计算","target":35},{"name":"通信、精密测量与实际应用","target":20},{"name":"相对论量子论与场论导览","target":25},{"name":"诠释与科学哲学","target":20},{"name":"量子生物与意识研究","target":15},{"name":"公众传播、灵性用语与争议溯源","target":20}],"missing":["中、英、日、德、法等多语种系统检索","历史原件、馆藏与 DOI Crosswalk","可追溯的事件地点与动态地理图","KOL原话及传播谱系","逐条授权的外部图片与视频","研究者独立复核","截至今日的前沿系统综述"]},"relationships":[{"from":"Q004","type":"demonstrates","to":"Q003"},{"from":"Q003","type":"explained_using","to":"Q007"},{"from":"Q019","type":"affects_visibility_of","to":"Q003"},{"from":"Q015","type":"tests_constraints_on","to":"Q014"},{"from":"Q017","type":"uses_resource","to":"Q014"},{"from":"Q021","type":"requires_distinction_from","to":"Q020"},{"from":"S15","type":"constrains_specific_models_of","to":"Q021"},{"from":"S16","type":"proposes_specific_mechanism_for","to":"Q021"}]}</script><script id="english-data" type="application/json">{"version":"0.2.0","entries":{"Q001":["Can light be detected one packet at a time?","Light exchanges energy with matter in quantized ways. A photon with a definite frequency has energy E = hf.","Dim the incoming light: a sensitive detector may still register discrete events.","The dots in illustrations do not mean photons are tiny solid balls with defined surfaces."],"Q002":["Is it a particle, or is it a wave?","Quantum objects can exhibit interference and be detected as discrete events. Classical balls and water waves are each only partial analogies.","Each detection makes one dot; many detections can build an interference pattern.","An object does not switch between a classical ball and a classical wave because of someone's thoughts."],"Q003":["How can two possibilities cancel each other?","For indistinguishable alternatives, add probability amplitudes before taking the squared magnitude. Relative phase can enhance some outcomes and suppress others.","Change the phase in the double-slit model and watch the bright and dark bands move.","Classical waves also interfere. Interference alone does not establish a uniquely quantum effect."],"Q004":["One particle at a time. Why do stripes appear?","When two paths remain coherent, discrete detections can accumulate into an interference pattern. Distinguishable path information can reduce its visibility.","Switch the path detector on and off, then accumulate more simulated detections.","This is sampling from a specified model, not live experimental data. A conscious person need not watch the detector."],"Q005":["How do we describe a system before predicting it?","A quantum state organizes predictions for measurement statistics. It is not simply a list of classical properties such as position and velocity.","Prepare the same state repeatedly, perform the same measurement, and compare outcome frequencies.","Interpretations differ on whether a quantum state describes reality itself, knowledge, or something else."],"Q006":["Is a probability cloud a real cloud of mist?","A wavefunction represents probability amplitudes in a chosen representation. For position measurements, its squared magnitude is a probability density.","Two wavefunctions can have different phases even when their position probability densities agree at one instant.","A wavefunction is generally complex-valued. It is not a vibration diagram of air, water, or spiritual matter."],"Q007":["How do we turn possibilities into testable numbers?","For a normalized state, an outcome's probability is the squared magnitude of its amplitude. Integrating a probability density over an interval gives that interval's probability.","Squaring the sum of two path amplitudes differs from simply adding their probabilities.","This statistical rule does not let us freely choose the next random outcome."],"Q008":["Does a physical observer have to be a person?","Measurement couples a system to an apparatus and produces a record. Standard calculations do not require human consciousness as an additional physical variable.","An automatic detector records data that a person reads later.","How a definite outcome arises raises interpretive questions. This does not establish that intention controls external outcomes."],"Q009":["Why can't both distributions become arbitrarily narrow?","Position and momentum standard deviations obey Δx Δp ≥ ℏ/2. A minimum-uncertainty Gaussian state attains equality.","Adjust the Gaussian width: as the position distribution narrows, the momentum distribution broadens.","This is a statistical constraint on particular observables, not a claim that everything is unknowable."],"Q010":["Why call it spin if it isn't a spinning ball?","Spin is an intrinsic form of angular momentum. The 1922 Stern–Gerlach experiment showed discrete splitting of a silver-atom beam.","Measuring a spin-one-half system along a chosen axis gives one of two possible outcomes.","Electron spin cannot be fully understood as a small classical ball rotating about an axis."],"Q011":["Why do atoms absorb particular colors?","Atomic bound states have discrete energy levels. An absorbed or emitted photon can carry the energy difference between two levels.","Use stairs to picture discrete values, then return to energy differences and photon energy.","Stairs are only an analogy. Not every energy in every quantum system has a discrete spectrum."],"Q012":["Can something appear beyond a barrier it cannot climb?","Under suitable conditions, a quantum state extends into a classically forbidden region and has a nonzero transmission probability beyond a barrier.","Vary a model barrier's width and compare transmission probabilities.","This does not imply people can walk through walls by intention. Probabilities depend on the actual system and barrier."],"Q013":["Can we tell two electrons apart by giving them names?","Exchange symmetry affects multiparticle states and their statistics. Bosons and fermions obey different exchange rules.","Move beyond labelled classical balls toward a description without individual classical identity tags.","Indistinguishability does not mean all different kinds of particles are the same."],"Q014":["When does a correlation go beyond the classical?","Entanglement is a quantum correlation that cannot be described by a separable state. Always matching or always opposing results alone do not distinguish it from classical correlation.","Compare joint statistics across several measurement settings, not a single coincidence.","Entanglement is not physical evidence for emotional affinity or soulmates."],"Q015":["How can a philosophical debate meet an experiment?","Under explicit assumptions, including locality and measurement-setting independence, Bell inequalities constrain correlations in certain classical models. Experiments test for violations.","The CHSH model compares the local bound of 2 with the ideal quantum value 2√2.","A plotted violation is not a new experiment. Real tests must address detection, locality, and other loopholes."],"Q016":["Can a correlation send an instant message?","One side's local outcomes alone do not reveal a freely chosen message from the other side. Comparing or using correlations still requires appropriate communication.","Change the distant setting: the theoretical probabilities on one side remain one half each.","Nonclassical correlations do not provide controllable faster-than-light communication."],"Q017":["What is teleported: an object, or a state?","Quantum teleportation uses shared entanglement, measurement, and classical communication to transfer an unknown quantum state to another system.","The receiver needs the sender's measurement result to complete the appropriate operation.","It does not transport a whole person or eliminate the need for classical messages."],"Q018":["What is the smallest unit of quantum information?","A qubit is described by a two-dimensional quantum system. Relative to a chosen basis, its state can be a superposition of the two basis states.","Two energy levels or polarization states can illustrate an abstract two-state system.","A single measurement does not reveal all the amplitudes as readable classical answers."],"Q019":["Why don't we see interference everywhere?","Interaction with the environment can reduce locally observable coherence. Environmental records make certain interference effects harder to observe.","Lower the visibility to fade the stripes. This is a phenomenological model, not a microscopic calculation.","Decoherence calculations do not automatically settle the problem of a single measurement outcome for every interpretation."],"Q020":["Does predicting correctly mean we understand everything?","Different frameworks interpret the relationships among quantum states, measurement, and reality. Testable predictions must be distinguished from ontological explanations.","Ask whether competing accounts predict different results, then compare their interpretations and additional assumptions.","Unresolved interpretive questions do not establish arbitrary supernatural claims."],"Q021":["Has anyone studied quantum processes in the brain?","Researchers have proposed mechanisms for quantum processing in the brain and calculated decoherence constraints on particular brain processes. Each model needs its own evaluation.","Read Fisher's nuclear-spin proposal alongside Tegmark's decoherence analysis, noting that they are not a direct controlled comparison of the same model.","These selected historical papers are not a current systematic review and do not establish a quantum explanation of consciousness."],"Q022":["Is a high-frequency mood a physical frequency?","For a photon of definite frequency, E = hf relates its energy and frequency. Using the same word for an emotion requires a separate definition.","Photon frequencies can be measured. Describing a mood as high-frequency usually serves a different linguistic purpose.","The photon equation does not establish that emotions change wealth, health, or other people's behavior through this mechanism."],"Q023":["Does linking a paper make a claim proven?","Distinguish experimental reports, theoretical proposals, reviews, and explainers. Then ask exactly which statement a source supports. A paper's existence does not equal independent confirmation.","An experimental abstract reports a measured correlation; a theoretical abstract proposes a possible mechanism. They need different evidence labels.","Source type and a claim's evidential status are separate fields. An institution's name is not a guarantee of a conclusion."],"Q024":["How does a quantum state change with time?","Within its domain of validity, the Schrödinger equation describes the time evolution of a quantum state. It requires an initial state and the system's Hamiltonian.","Given a potential and an initial wavefunction, calculate a later probability distribution and compare it with observations.","This is not a formula that turns wishes into outcomes. Nonrelativistic models also have limits of applicability."]},"categories":[["Light & waves","Begin with observable patterns"],["Quantum rules","A different language for nature"],["Atoms & matter","Small scales, big differences"],["Correlations & information","What entanglement can do"],["Consciousness & boundaries","Open questions, explicit evidence"],["Reading science","Concepts, evidence, and metaphor"]],"bridges":[["Does the observer effect mean consciousness creates reality?","Physics and philosophical questions","Quantum measurement involves recordable physical interactions. Standard calculations do not require consciousness as an extra variable. Interpretations can be discussed without concluding that intention controls results."],["Does entanglement prove telepathy?","This conclusion does not follow","Entanglement has precise preparation, measurement, and statistical requirements. It does not automatically apply to personal rapport or let one party read a faster-than-light message from local outcomes alone."],["Is raising your frequency the same as E = hf?","Separate metaphor from measurable quantities","Photon energy and frequency have a defined relationship. Frequency as a description of mood or values may be expressive language, but that does not make it the same physical quantity."],["Is quantum consciousness an unstudied question?","Theoretical research is not confirmation","There are proposals for quantum processing in the brain and analyses of decoherence constraints. We label each model, author, and evidence status rather than turning a debate into a completed proof."],["Does uncertainty mean any wish can come true?","A statistical constraint is not a wish mechanism","Uncertainty relations constrain distributions of specific observables. Probabilities depend on states and experimental conditions; they are not arbitrary probabilities for anything we can imagine."],["Can I value spiritual experience while learning science?","Our editorial approach","You can begin with your own questions and experiences. We distinguish subjective experience, cultural meaning, philosophical views, and testable physical claims. Respecting an experience does not automatically establish a particular mechanism."]],"timeline":[["One beam, two discrete paths","The Stern–Gerlach experiment enters this learning trail: how did it challenge classical intuitions about angular momentum?"],["A new quantum description takes shape","Feynman's historical introduction identifies 1926–1927 as a key period in forming a consistent quantum description. This is a period marker, not an exact date for one event."],["Estimating constraints on brain-based quantum processes","Tegmark's paper appeared as a preprint in 1999 and in a journal in 2000. It estimates decoherence for particular modeled brain processes."],["Why does the world often look classical?","Zurek's review of decoherence was published in 2003; the first arXiv version was submitted in 2001."],["Making a Bell test more rigorous","Giustina and colleagues reported a photonic Bell test closing major loopholes simultaneously. We link the paper but have not reanalyzed its raw data."],["Another proposal for quantum processing in the brain","Fisher proposed a possible mechanism involving nuclear spins and particular molecules. A research proposal is not a confirmed mechanism of consciousness."]],"source_limits":{"S07":"This page uses strong interpretive language about measurement. We do not present one ontological interpretation as a consensus across all interpretations.","S15":"The estimates apply to the modeled degrees of freedom and parameters, not automatically to every possible quantum mechanism in a brain.","S16":"A proposed research mechanism is not confirmation that human consciousness arises through it.","S19":"This external simulation is linked, not integrated or tested within this site."},"domains":["Scientific history and classic experiments","Mathematical tools and formalism","Core principles and measurement","Atoms, molecules, function updateQuiz(){const el=$('#quiz');if(!el)return;el.outerHTML=quiz();const done=Object.keys(answers).length;$('#quiz .q-quiz-score').textContent=t('已完成 ','Completed ')+done+'/6 · '+t('正确 ','Correct ')+Object.entries(answers).filter(([i,a])=>a===quizData()[i][5]).length}
function notebook(){return `<section class="q-width q-workspace"><div class="q-note-layout"><div><span class="q-eyebrow">CURIOSITY, IN YOUR OWN WORDS</span><h2>${t('把今天的发现留下来。','Make the discovery your own.')}</h2><p>${t('这是一份只存于当前浏览器的学习手记，不是公共论坛，也不会自动上传。写好后可导出或分享给朋友。','This notebook stays in this browser. It is not a public forum and is not uploaded automatically. Export or share it with a friend.')}</p><div class="q-prompts">${['今天哪个解释改变了你的直觉？','哪个说法需要更多证据？','下一次实验，你想改变什么？'].map((z,i)=>`<button class="step" data-prompt="${i}">${t(z,['What changed your intuition today?','Which claim needs more evidence?','What would you change in the next experiment?'][i])}</button>`).join('')}</div></div><div class="q-notebook"><label for="notebook">${t('我的探索手记','My exploration notebook')}</label><textarea id="notebook" rows="9" maxlength="12000" placeholder="${t('一个问题，一次发现……','A question. A discovery…')}">${esc(stored('quri-notebook',''))}</textarea><div class="actions"><button class="btn primary" data-q="save-note">${t('保存到本机','Save locally')}</button><button class="btn" data-q="export-note">${t('导出手记','Export note')}</button><button class="btn" data-q="share-note">${t('分享','Share')}</button></div><p id="note-status" role="status"></p></div></div></section>`}
function about(){return `<section class="q-width q-workspace"><div class="q-editorial"><span class="q-eyebrow">STAY CURIOUS. FOLLOW THE EVIDENCE.</span><h2>${t('一座有证据入口的想象之城。','A city of imagination, with a trail of evidence.')}</h2><p>${t('QuriAtlas 把量子力学入门内容、图解与互动模型放在同一个学习空间。你可以从现象开始，也可以从意识、现实或灵性相关问题进入，再逐层追到原始解释和来源。','QuriAtlas brings introductory quantum physics, visual explanations, and interactive models into one learning space. Begin with an experiment or a question about consciousness and reality, then trace the reasoning and its sources.')}</p><h3>${t('科学与艺术的边界','Science and art have different roles')}</h3><p>${t('亚特兰蒂斯、星球、探索者和 memo 猫是网站的虚构美术世界。场景、发光球体和装饰性图案不是实际实验装置或量子态的准确图像。实验区另外标注模型与假设；意识讨论分别说明理论、诠释和个人体验。','Atlantis, the planets, the explorer, and memo cat form a fictional visual world. The glowing spheres and decorative motifs are not accurate depictions of apparatus or quantum states. The lab states its model assumptions, while the consciousness pages distinguish theory, interpretation, and personal experience.')}</p><h3>${t('当前收录与隐私','Collection status and privacy')}</h3><p>${t('当前为 24 个概念、20 个来源入口、4 个教学模型的研究预览，不声称全网穷尽或专家审稿完成。阅读进度、语言与手记保存在本机；没有账号、支付、公共发帖或后台 AI 对话服务。','This research preview contains 24 concepts, 20 source entries, and four teaching models. It is not an exhaustive survey or a completed expert review. Progress, language, and notebook data stay in your browser; there are no accounts, payments, public posts, or hosted AI chat.')}</p><div class="actions"><a class="btn primary" href="${pageUrl('sources')}">${t('查看来源','Read the sources')} →</a><a class="btn" href="${pageUrl('journey')}">${t('选择学习路线','Choose a learning path')} →</a></div></div></section>`}
function entanglement(){return `<section class="q-width q-workspace"><div class="q-editorial"><span class="q-eyebrow">FROM CURIOSITY TO A TESTABLE QUESTION</span>${['Q014','Q015','Q016','Q017'].map(id=>{const e=entry(id);return `<article class="q-essay"><h2>${esc(e.title)}</h2><p>${esc(e.summary)}</p><div class="note"><b>${t('解释的边界','Limits of the explanation')}</b>${esc(e.limit)}</div><p class="small">${srcLinks(e.source_ids)}</p><button class="btn" data-entry="${id}">${t('继续深入','Go deeper')} →</button></article>`}).join('')}<a class="btn primary" href="${pageUrl('lab','#bell')}">${t('亲手调整贝尔模型','Explore the Bell model')} →</a></div></section>`}
function footer(){return `<footer class="q-footer"><div class="q-width"><div class="q-footer-main">${logo()}<nav>${[['journey','学习旅程','Learning journey'],['sources','证据书架','Sources'],['about','方法与隐私','Method & privacy'],['community','探索手记','Notebook']].map(([p,z,e])=>`<a href="${pageUrl(p)}">${t(z,e)}</a>`).join('')}</nav><button class="btn quiet" data-action="motion" aria-pressed="${still}">${still?t('动效：关','Motion: off'):t('动效：开','Motion: on')}</button></div><p>${t('艺术场景为虚构视觉；实验为教学模型。保持好奇，也看见证据。','Fictional artistic scenes. Educational scientific models. Stay curious. Follow the evidence.')}</p><small>QuriAtlas × memo · <span id="release-version">${RELEASE}</span> · ${t('研究预览','Research preview')}</small></div></footer>`}
function retargetLinks(){const map={home:'home',learn:'journey',atlas:'explore',lab:'lab',bridge:'mind',history:'stories',sources:'sources',filters:'explore'};$$('#page-content a[href^="#"]').forEach(a=>{const id=a.getAttribute('href').slice(1);if(map[id]&&map[id]!==PAGE)a.href=pageUrl(map[id],'#'+id)});}
render=function(){
 legacyRender();
 const legacyMain=$('#home');legacyMain.id='legacy-home';legacyMain.hidden=true;
 const contentByPage={explore:['atlas'],lab:['lab'],mind:['bridge'],stories:['history'],journey:['learn'],sources:['sources']};
 const selected=(contentByPage[PAGE]||[]).map(id=>legacyMain.querySelector('#'+id));
 const homeMarkup=PAGE==='home'?home():innerHero();
 $('#app').innerHTML=header()+homeMarkup+`<main id="page-content" tabindex="-1"></main>`+footer();
 $('#app').appendChild(legacyMain);
 const main=$('#page-content');selected.forEach(s=>main.appendChild(s));
 if(PAGE==='play')main.innerHTML=quiz();
 if(PAGE==='community')main.innerHTML=notebook()+`<div class="q-width q-community-links">${tile('lab','和朋友试一个实验','Try an experiment together')}${tile('sources','让讨论有据可循','Ground the conversation in sources')}${tile('journey','选择下一条路线','Choose your next path')}</div>`;
 if(PAGE==='about')main.innerHTML=about();
 if(PAGE==='entanglement')main.innerHTML=entanglement();
 if(PAGE==='journey')main.insertAdjacentHTML('beforeend',notebook());
 if(PAGE==='home')main.innerHTML='';
 if(PAGE==='lab'&&location.hash==='#bell'){lab='bell';renderLab();}
 if(PAGE==='play')updateQuiz();
 retargetLinks();window.QURI_BUILD=RELEASE;document.documentElement.dataset.release=RELEASE;
 document.title=t(pages[PAGE][0]+'｜量子漫游 QuriAtlas',pages[PAGE][1]+' | QuriAtlas');
};
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-q],[data-quiz],[data-prompt]');if(!b)return;
 if(b.dataset.quiz!==undefined){answers[+b.dataset.quiz]=+b.dataset.choice;updateQuiz();return;}
 if(b.dataset.prompt!==undefined){const txt=b.textContent;const box=$('#notebook');box.value+=(box.value?'\n\n':'')+txt+'\n';box.focus();return;}
 const status=$('#note-status');
 switch(b.dataset.q){
 case'menu':{const menu=$('.q-mobile-menu');menu.hidden=!menu.hidden;b.setAttribute('aria-expanded',String(!menu.hidden));break;}
 case'search':if(PAGE==='explore'){$('#search').scrollIntoView({behavior:still?'auto':'smooth',block:'center'});$('#search').focus()}else location.href=pageUrl('explore','#filters');break;
 case'reset-quiz':answers={};updateQuiz();break;
 case'save-note':try{localStorage.setItem('quri-notebook',$('#notebook').value);status.textContent=t('已保存在当前浏览器。','Saved in this browser.')}catch{status.textContent=t('浏览器不允许存储，请使用导出。','Storage is unavailable. Export your note instead.')}break;
 case'export-note':{const blob=new Blob([$('#notebook').value],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='QuriAtlas-notebook.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break;}
 case'share-note':try{const text=$('#notebook').value;if(navigator.share)await navigator.share({title:'QuriAtlas',text,url:'https://quriatlas.saga1001.com/'});else {await navigator.clipboard.writeText(text);status.textContent=t('已复制，可粘贴分享。','Copied. Paste it to share.')}}catch(e){status.textContent=t('未完成分享；手记仍保留，可使用导出。','Sharing was not completed. Your note is still here; export it instead.')}break;
 }
});
const oldDraw=drawLab;
drawLab=function(){oldDraw();const c=$('#experiment');if(c){const dpr=Math.min(devicePixelRatio||1,2);c.setAttribute('data-render-scale','1.5');}};
render();
// Resolve legacy section URLs only once. Language preferences are kept in the query.
if(PAGE==='home'&&['#sources','#atlas','#lab','#bridge','#history','#learn'].includes(location.hash)){
 const m={'#sources':'sources','#atlas':'explore','#lab':'lab','#bridge':'mind','#history':'stories','#learn':'journey'};location.replace(pageUrl(m[location.hash],location.hash));
}
requestAnimationFrame(()=>{if(location.hash){const target=document.getElementById(location.hash.slice(1));if(target&&!target.closest('[hidden]'))target.scrollIntoView({behavior:'instant'})}});

/* Production state, accessibility and responsive drawing. No new backend. */
'use strict';
window.QURI_SOURCE_COMMIT = document.querySelector('meta[name="quri-source-commit"]').content;
const _switchLanguage = switchLang;
switchLang = function(next) {
  const box = document.getElementById('notebook');
  const draft = box ? box.value : null;
  const start = box ? box.selectionStart : 0, end = box ? box.selectionEnd : 0;
  _switchLanguage(next);
  const nextBox = document.getElementById('notebook');
  if (nextBox && draft !== null) {
    nextBox.value = draft;
    nextBox.setSelectionRange(start, end);
  }
  decoratePage();
};
function decoratePage() {
  document.querySelectorAll('.q-mobile-menu a').forEach(a => {
    if (a.pathname.split('/').pop() === (PAGE === 'home' ? 'index.html' : PAGE + '.html')) a.setAttribute('aria-current', 'page');
  });
  const menu = document.querySelector('.q-mobile-menu');
  if (menu) {
    menu.id = 'mobile-navigation';
    document.querySelector('[data-q="menu"]').setAttribute('aria-controls', menu.id);
  }
  document.querySelectorAll('.q-art').forEach(img => {
    img.draggable = false;
    img.dataset.role = 'illustration';
  });
}
// Keep a tab's experiment state across page visits; notebook remains explicitly
// saved to localStorage only when the visitor presses "Save locally".
function rememberExperiment() {
  if (PAGE !== 'lab') return;
  try {
    sessionStorage.setItem('quri-lab-v1', JSON.stringify({lab, phase, visibility, detector, width, theta, hits, pairs}));
  } catch (_) { /* Privacy modes may block browser storage. */ }
}
function restoreExperiment() {
  if (PAGE !== 'lab') return;
  try {
    const state = JSON.parse(sessionStorage.getItem('quri-lab-v1') || 'null');
    if (!state || typeof state !== 'object') return;
    if (labIds.includes(state.lab) && location.hash !== '#bell') lab = state.lab;
    const number = (key, min, max, fallback) => Number.isFinite(state[key]) ? Math.max(min, Math.min(max, state[key])) : fallback;
    phase = number('phase',0,360,0); visibility = number('visibility',0,100,100);
    width = number('width',.3,2,.7); theta = number('theta',0,90,45);
    detector = state.detector === true;
    hits = Array.isArray(state.hits) ? state.hits.filter(p => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite) && p[0]>=60 && p[0]<=760 && p[1]>=235 && p[1]<=304).slice(0,10000) : [];
    pairs = state.pairs && ['a','b','same'].every(k => Number.isInteger(state.pairs[k]) && state.pairs[k] >= 0 && state.pairs[k] <= 1000) ? state.pairs : null;
    renderLab();
  } catch (_) { /* Ignore malformed previous-session state. */ }
}
window.addEventListener('pagehide', rememberExperiment);
const _drawExperiment = drawLab;
drawLab = function() {
  _drawExperiment();
  const canvas = document.getElementById('experiment');
  if (canvas) canvas.dataset.renderScale = String(canvas.width / 820);
};
let repaintTimer;
window.addEventListener('resize', () => {
  clearTimeout(repaintTimer);
  repaintTimer = setTimeout(() => { if (PAGE === 'lab') drawLab(); }, 180);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const menu = document.querySelector('.q-mobile-menu');
  if (menu && !menu.hidden) {
    menu.hidden = true;
    const button = document.querySelector('[data-q="menu"]');
    button.setAttribute('aria-expanded','false'); button.focus();
  }
});
decoratePage(); restoreExperiment();
if (PAGE === 'lab') drawLab();
</script></body></html>
